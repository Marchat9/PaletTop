name: Lint

on:
    pull_request:
        branches: [main]

# A new push to the same PR obsoletes the previous lint run.
concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # Both PR comments and PR labels go through the Issues API under the hood,
    # so they need `issues: write` — `pull-requests: write` alone isn't enough.
    issues: write
    pull-requests: write

jobs:
    # Detects which project(s) the PR actually touches, so a PR that only changes
    # `frontend/` doesn't also lint an untouched backend (and vice versa).
    changes:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
            frontend: ${{ steps.filter.outputs.frontend }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect changed projects
              uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      backend:
                          - 'backend/**'
                      frontend:
                          - 'frontend/**'

            # Labels the PR with `frontend`, `backend`, or both, based on the same
            # path detection used to decide what to lint above. Labels that don't
            # exist yet in the repo are created automatically by this API call.
            - name: Label PR with touched project(s)
              if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      const labels = [];
                      if ('${{ steps.filter.outputs.backend }}' === 'true') labels.push('backend');
                      if ('${{ steps.filter.outputs.frontend }}' === 'true') labels.push('frontend');

                      await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          labels,
                      });

    lint:
        needs: changes
        # Without an explicit `name:`, the status check context GitHub reports (and
        # what a branch protection rule would have to match on) concatenates every
        # matrix property (name, context, command) instead of just `name` — fragile,
        # since editing `command` would silently change the check's name.
        name: lint (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Backend has real ESLint. Frontend has no ESLint config yet, so it
                    # only gets a Prettier format check for now.
                    - name: backend
                      context: ./backend
                      command: npm run lint
                    - name: frontend
                      context: ./frontend
                      command: npm run format:check
        # Only lint a project if something under its directory actually changed. A
        # job-level `env:` (unlike a job-level `if:`) has access to `matrix`/`needs`,
        # so the check lives here and is reused as `env.SHOULD_LINT` below.
        env:
            SHOULD_LINT: ${{ (matrix.name == 'backend' && needs.changes.outputs.backend == 'true') || (matrix.name == 'frontend' && needs.changes.outputs.frontend == 'true') }}
        steps:
            - name: Checkout
              if: env.SHOULD_LINT == 'true'
              uses: actions/checkout@v4

            - name: Set up Node.js
              if: env.SHOULD_LINT == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: ${{ matrix.context }}/package-lock.json

            - name: Install dependencies
              if: env.SHOULD_LINT == 'true'
              working-directory: ${{ matrix.context }}
              run: npm ci

            - name: Run lint
              id: lint
              if: env.SHOULD_LINT == 'true'
              working-directory: ${{ matrix.context }}
              # NO_COLOR tells eslint/prettier (via chalk) to skip ANSI color codes,
              # since the output ends up in a plain-text PR comment, not a terminal.
              env:
                  NO_COLOR: '1'
              # `set -o pipefail` makes this step's exit code the linter's exit code,
              # not `tee`'s — `tee` only mirrors the output to a file the comment step
              # below can read, it shouldn't hide a lint failure.
              run: |
                  set -o pipefail
                  ${{ matrix.command }} 2>&1 | tee lint-output.txt

            # Only runs when the lint step itself failed (not e.g. a `npm ci` failure,
            # and not when the matrix leg was skipped entirely). A custom `if:` that
            # doesn't reference a status function (success/failure/always/cancelled)
            # still gets an implicit `success()` ANDed in by GitHub — and by this point
            # the job is already failing, so that implicit success() would always be
            # false. `failure()` overrides that default so the condition below actually
            # gets evaluated. Uploaded (rather than commented right here) so the
            # `comment` job below can combine both matrix legs into a single PR comment
            # instead of one per project.
            - name: Upload lint output
              if: failure() && steps.lint.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: lint-output-${{ matrix.name }}
                  path: ${{ matrix.context }}/lint-output.txt
                  retention-days: 1

    # Combines whatever `lint-output-*` artifacts exist (one per failed matrix leg,
    # zero if everything passed) into a single PR comment. `if: always()` so it still
    # runs — and reports — when the `lint` job failed; a job only runs by default when
    # every job in `needs` succeeded.
    comment:
        needs: [changes, lint]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Download lint outputs
              uses: actions/download-artifact@v4
              with:
                  pattern: lint-output-*
                  path: lint-outputs
                  if-no-artifact-found: ignore

            - name: Build combined comment body
              id: build
              run: |
                  body_file=comment-body.md
                  : > "$body_file"
                  found=false

                  for dir in lint-outputs/lint-output-*/; do
                      [ -d "$dir" ] || continue
                      found=true
                      name="$(basename "$dir")"
                      name="${name#lint-output-}"

                      {
                          echo "### ❌ Lint failed — \`$name\`"
                          echo
                          echo '```'
                          # Strip ANSI color codes (belt-and-suspenders alongside NO_COLOR
                          # on the lint step) — raw escape codes are unreadable once dumped
                          # into a plain-text PR comment code block.
                          # Stay comfortably under GitHub's ~65536 char comment limit,
                          # split across however many projects failed.
                          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$dir/lint-output.txt" | head -c 30000
                          echo
                          echo '```'
                          echo
                      } >> "$body_file"
                  done

                  echo "found=$found" >> "$GITHUB_OUTPUT"

            - name: Comment on PR
              if: steps.build.outputs.found == 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('comment-body.md', 'utf8');

                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                      });
