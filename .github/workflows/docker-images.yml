name: Docker Images

on:
    push:
        tags: ['v*'] # ex: v1.4.2
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: backend
                      context: ./backend
                    - name: frontend
                      context: ./frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Compute lowercase image repository
              run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-${{ matrix.name }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha
                      type=raw,value=latest,enable=${{ github.event_name == 'push' }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  target: production
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-build-cache:{2},mode=max', env.REGISTRY, env.IMAGE_REPO, matrix.name) || '' }}
