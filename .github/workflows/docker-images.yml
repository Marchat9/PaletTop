name: Docker Images

on:
    push:
        tags: ['v*'] # ex: v1.4.2
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io

# Cancel superseded runs on a PR (new push to the same branch obsoletes the previous
# build). Never cancel a tag push — a release build always runs to completion.
concurrency:
    group: docker-images-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    packages: write

jobs:
    # Detects which project(s) a PR actually touches, so a PR that only changes
    # `frontend/` doesn't also spend CI minutes building an unchanged backend image (and
    # vice versa). Always runs (even on tag pushes) to keep the "Build and push" step's
    # `if` simple — its output is only consulted for pull_request events, see below.
    changes:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
            frontend: ${{ steps.filter.outputs.frontend }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect changed projects
              uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      backend:
                          - 'backend/**'
                      frontend:
                          - 'frontend/**'

    build:
        needs: changes
        # Without an explicit `name:`, the status check context concatenates every
        # matrix property (name, context) instead of just `name` — fragile, since
        # editing `context` would silently change the check's name.
        name: build (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: backend
                      context: ./backend
                    - name: frontend
                      context: ./frontend
        # On a PR, skip a project's image entirely if nothing under its directory
        # changed. Tag pushes (releases) always build+push both, so a version tag never
        # publishes just one half of the app. Computed once here — a job-level `env:`
        # (unlike a job-level `if:`) has access to `matrix`/`needs` — and reused as
        # `env.SHOULD_BUILD` in every step's `if:` below.
        env:
            SHOULD_BUILD: ${{ github.event_name != 'pull_request' || (matrix.name == 'backend' && needs.changes.outputs.backend == 'true') || (matrix.name == 'frontend' && needs.changes.outputs.frontend == 'true') }}
            # Overwritten below on a tag push — stays at this placeholder for PR builds,
            # matching the frontend's own committed default (see environment.version.ts).
            APP_VERSION: '0.0.0'
        steps:
            - name: Checkout
              if: env.SHOULD_BUILD == 'true'
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              if: env.SHOULD_BUILD == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Compute lowercase image repository
              if: env.SHOULD_BUILD == 'true'
              run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            # Strips the leading 'v' from the release tag (ex: v1.4.2 -> 1.4.2), matching
            # the `type=semver,pattern={{version}}` Docker tag derived below — the app's
            # displayed version and its image tag always agree.
            - name: Compute app version
              if: env.SHOULD_BUILD == 'true' && github.ref_type == 'tag'
              run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Log in to GitHub Container Registry
              if: env.SHOULD_BUILD == 'true' && github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              if: env.SHOULD_BUILD == 'true'
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}-${{ matrix.name }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha
                      type=raw,value=latest,enable=${{ github.event_name == 'push' }}

            - name: Build and push
              if: env.SHOULD_BUILD == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  target: production
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Only the frontend Dockerfile declares APP_VERSION as an ARG.
                  build-args: ${{ matrix.name == 'frontend' && format('APP_VERSION={0}', env.APP_VERSION) || '' }}
                  # No attestation manifest: keeps the pushed image a plain single-arch
                  # image rather than an OCI index, which is what `docker run` on a
                  # self-hosted deployment expects.
                  provenance: false
                  # Same backend both ways (GitHub's own cache storage, not a registry
                  # image) so cache actually round-trips between runs, and no
                  # `*-build-cache` package is ever created in GHCR. `mode=max` caches
                  # the intermediate `dev`/`build` stages too, not just the final
                  # `production` layer — those are what `npm ci`/`npm run build` land in.
                  # `ignore-error=true`: the GHA cache backend occasionally returns a
                  # transient 5xx on export (seen in the wild as "failed to parse error
                  # response 504") — without this flag that turns a flaky cache write into
                  # a failed build. cache-to is skipped entirely on PRs so only tag pushes
                  # (which is what we actually want warm) touch the cache export path.
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max,ignore-error=true', matrix.name) || '' }}
