name: Zizmor

on:
    pull_request:
        branches: [main]
        paths: ['.github/**']

permissions:
    contents: read

jobs:
    zizmor:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Run zizmor
              uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
