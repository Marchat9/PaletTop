name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Weekly scan catches vulnerabilities newly published against dependencies that
        # haven't otherwise changed (no push/PR would trigger a scan on its own).
        - cron: '23 4 * * 1'

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:javascript-typescript'
