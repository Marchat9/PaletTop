<app-card>
  <div class="section-tournament">
    <div class="title">
      <h3>Tournois</h3>
      <app-icon name="sports_kabaddi" iconClass="icon" />
    </div>

    <div class="play">
      <p class="description">
        Entrez dans la mêlée et mesurez-vous aux challengers dans un tournoi de
        <span class="palet">Palet</span>.
      </p>
      <div class="action">
        <app-button
          title="Rejoindre en joueur"
          icon="explore"
          [large]="true"
          (clicked)="eventTournamentJoin.emit()"
        />
        <app-button
          title="Regarder en spectateur"
          icon="visibility"
          variant="secondary"
          [large]="true"
          (clicked)="eventTournamentSpectate.emit()"
        />
      </div>
    </div>

    <div class="organiser">
      <span class="eyebrow">Espace organisateur</span>
      <app-action-row
        icon="add_moderator"
        title="Créer un tournoi"
        description="Règles, équipes et tirages automatiques"
        (clicked)="eventTournamentCreation.emit()"
      />
      <app-action-row
        icon="admin_panel_settings"
        title="Administrer un tournoi"
        description="Reprendre un tournoi existant"
        (clicked)="eventTournamentAdministration.emit()"
      />
    </div>
  </div>
</app-card>
