<div class="home-page">
  <app-title-and-description class="one-column" />

  <app-section-tournament
    class="two-column"
    (eventTournamentJoin)="openModaleTournamentJoin()"
    (eventTournamentSpectate)="openModaleTournamentSpectate()"
    (eventTournamentCreation)="goToTournamentCreation()"
  ></app-section-tournament>

  <app-section-training
    class="two-column"
    (eventTrainingJoin)="openModaleTrainingJoin()"
    (eventTrainingCreation)="goToTrainingCreation()"
  ></app-section-training>

  <app-section-friendly-match
    class="one-column"
    (eventGoToFriendlyMatch)="goToFriendlyMatch()"
  />

  @if (metrics().length > 0) {
    <app-section-metrics class="one-column" [metrics]="metrics()" />
  }
</div>
