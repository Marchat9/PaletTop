<div class="home-page">
  <app-title-and-description class="header" />

  <app-section-tournament
    class="tournament"
    (eventTournamentJoin)="openModaleTournamentJoin()"
    (eventTournamentSpectate)="openModaleTournamentSpectate()"
    (eventTournamentCreation)="goToTournamentCreation()"
  ></app-section-tournament>

  <app-section-friendly-match
    class="friendly-match"
    (eventGoToFriendlyMatch)="goToFriendlyMatch()"
  />
  @if (metrics().length > 0) {
    <app-section-metrics class="metric" [metrics]="metrics()" />
  }
</div>
