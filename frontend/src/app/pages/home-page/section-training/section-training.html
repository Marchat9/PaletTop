<app-card>
  <div class="section-training">
    <div class="title">
      <h3>Entrainements</h3>
      <app-icon name="school" iconClass="icon" />
    </div>
    <div class="training-info">
      <div class="join-training">
        <div class="header">
          <div class="sub-title">
            <h3>Rejoindre un entrainement</h3>
          </div>
          <div class="description">
            <span>Faites chauffer vos <span class="palet">Palets</span> lors de sessions d'entrainement.</span>
          </div>
        </div>

        <div class="action">
          <app-button title="En tant que joueur" icon="explore" (clicked)="eventTrainingJoin.emit()" />
        </div>
      </div>
      <div class="create-training">
        <div class="header">
          <div class="sub-title">
            <h3>Administrez vos entrainements</h3>
          </div>
          <div class="description">
            <span>Créez un club ou groupe d'entrainement puis administrez vos sessions d'<span class="highlight">entrainements</span></span>
          </div>
        </div>

        <div class="action">
          <app-button title="Créer un club ou groupe d'entrainement" [titleCanWrap]="true" icon="group_add" (clicked)="eventTrainingCreation.emit()" />
        </div>
      </div>
    </div>
  </div>
</app-card>
