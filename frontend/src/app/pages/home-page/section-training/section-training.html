<app-card>
  <div class="section-training">
    <div class="title">
      <h3>Entraînements</h3>
      <app-icon name="school" iconClass="icon" />
    </div>

    <div class="play">
      <p class="description">
        Faites chauffer vos <span class="palet">Palets</span> lors de séances d'entraînement.
      </p>
      <div class="action">
        <app-button
          title="Rejoindre en joueur"
          icon="explore"
          [large]="true"
          (clicked)="eventTrainingJoin.emit()"
        />
        <app-button
          title="Regarder en spectateur"
          icon="visibility"
          variant="secondary"
          [large]="true"
          (clicked)="eventTrainingSpectate.emit()"
        />
      </div>
    </div>

    <div class="organiser">
      <span class="eyebrow">Espace organisateur</span>
      <app-action-row
        icon="group_add"
        title="Créer un club ou un groupe"
        description="Puis planifier vos séances"
        (clicked)="eventTrainingCreation.emit()"
      />
      <app-action-row
        icon="admin_panel_settings"
        title="Administrer un groupe"
        description="Séances, participants, résultats"
        (clicked)="eventTrainingAdministration.emit()"
      />
    </div>
  </div>
</app-card>
