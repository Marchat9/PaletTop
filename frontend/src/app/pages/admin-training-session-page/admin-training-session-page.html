<div class="admin-training-session-page">
  <app-back-link
    [label]="training()?.name || 'Retour à l\'entraînement'"
    (clicked)="backToTraining()"
  />

  <div
    class="session-body"
    [appAnimateOnChange]="session()?.code"
    animation="slide-in"
    [animateOnInit]="true"
  >
    <app-session-header [session]="session()" [metrics]="headerMetrics()" />

    <app-session-actions
      [isSessionOpen]="isSessionOpen()"
      [canCloseSession]="canCloseSession()"
      [generateBlockedReason]="generateBlockedReason()"
      [generateBlockedIsAlert]="generateBlockedIsAlert()"
      [nextRoundPreview]="nextRoundPreview()"
      [closeLoading]="closeSessionLoading()"
      [closeError]="closeSessionError()"
      (openCheckin)="openCheckin()"
      [canPlayMyMatches]="!!adminParticipant()"
      [playMyMatchesDisabled]="playMyMatchesDisabled()"
      (closeSession)="closeSession()"
      (playMyMatches)="playMyMatches()"
    />

    <app-current-round-card
      [roundNumber]="currentRound()?.roundNumber ?? null"
      [groups]="currentRoundGroups()"
      [showMatches]="!!currentRound()"
      [pointsPerGame]="pointsPerGame()"
      [editable]="isCurrentRoundEditable()"
      [scoreUpdateLoading]="scoreLoading()"
      [message]="currentRoundMessage()"
      [isLoading]="roundsLoading()"
      [showNextButton]="isSessionOpen()"
      nextLabel="Générer le round suivant"
      [canGenerateNext]="canGenerateRound()"
      [nextLoading]="generateRoundLoading()"
      (scoreUpdate)="updateScore($event)"
      (nextRound)="generateRound()"
    />

    <app-session-participants
      [participants]="session()?.participants ?? []"
      [isSessionOpen]="isSessionOpen()"
      [newParticipantId]="lastCheckedIn()?.id ?? null"
      (markLeft)="markParticipantLeft($event)"
    />

    <app-session-teams
      [teams]="session()?.teams ?? []"
      [availableParticipants]="participantsWithoutTeam()"
      [isSessionOpen]="isSessionOpen()"
      [createLoading]="createTeamLoading()"
      (createTeam)="createTeam($event)"
      (dissolveTeam)="dissolveTeam($event)"
    />

    <app-leaderboard
      [table]="leaderboardTable()"
      [isLoading]="leaderboardLoading()"
      title="Classement de la séance"
      titleSize="compact"
      description="Classement individuel : chaque joueur d'une équipe gagnante marque la totalité des points."
      emptyLabel="Aucun match validé pour l'instant."
    >
      <app-button
        leaderboardActions
        class="club-button"
        title="Classement du club"
        icon="military_tech"
        variant="tertiary"
        (clicked)="openClubLeaderboard()"
      />
    </app-leaderboard>

    <app-rounds-history
      [rounds]="roundHistories()"
      [pointsPerGame]="pointsPerGame()"
      description="Revoir les matchs des rounds précédents de la séance."
      searchPlaceholder="Filtrer par joueur ou équipe"
    />
  </div>
</div>
