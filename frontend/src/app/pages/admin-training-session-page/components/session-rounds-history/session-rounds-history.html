@if (rounds().length > 0) {
  <app-card-collapsible [isExpanded]="false">
    <div header class="header">
      <div class="header-title">
        <app-icon name="history" iconClass="icon" [ariaHidden]="true" />
        <span class="title"
          >Rounds précédents <span class="count">({{ rounds().length }})</span></span
        >
      </div>
    </div>

    <div content class="history-content">
      @for (round of rounds(); track round.id) {
        <div class="round">
          <span class="round-label">Round {{ round.roundNumber }}</span>
          <app-round-matches [round]="round" [pointsPerGame]="pointsPerGame()" [editable]="false" />
        </div>
      }
    </div>
  </app-card-collapsible>
}
