<app-admin-page-header
  eyebrow="Séance d'entraînement"
  icon="sports_score"
  [title]="session() ? (session()!.date | date: 'EEEE d MMMM y') : null"
  [capitalizeTitle]="true"
  [code]="session()?.code ?? null"
  codeLabel="Code de la séance"
  [prominentCode]="true"
  [statuses]="statuses()"
  [metrics]="metrics()"
>
  <app-inline-notice
    >Chaque joueur se connecte avec ce code, suivi de son code personnel à quatre
    chiffres.</app-inline-notice
  >

  <app-rule-pills [rules]="rules()" />
</app-admin-page-header>
