@if (isSessionOpen()) {
  <div class="session-actions">
    <div class="buttons">
      <app-button
        title="Inscrire un joueur"
        icon="person_add"
        variant="primary"
        [large]="true"
        (clicked)="openCheckin.emit()"
      />
      @if (canPlayMyMatches()) {
        <app-button
          title="Jouer mes matchs"
          icon="sports_esports"
          variant="secondary"
          [large]="true"
          [disabled]="playMyMatchesDisabled()"
          (clicked)="playMyMatches.emit()"
        />
      }
      <span class="spacer"></span>
      <app-button
        title="Clôturer la séance"
        icon="lock"
        variant="tertiary"
        [loading]="closeLoading()"
        [disabled]="!canCloseSession()"
        (clicked)="closeSession.emit()"
      />
    </div>

    @if (!generateBlockedReason() && nextRoundPreview(); as preview) {
      <app-inline-notice
        icon="visibility"
        role="status"
        [appAnimateOnChange]="preview"
        animation="fade-in"
        >{{ preview }}</app-inline-notice
      >
    }

    @if (closeError(); as error) {
      <app-inline-notice tone="alert" role="alert">{{ error }}</app-inline-notice>
    }

    @if (generateBlockedReason(); as reason) {
      <app-inline-notice
        role="status"
        [tone]="generateBlockedIsAlert() ? 'alert' : 'info'"
        [appAnimateOnChange]="reason"
        animation="fade-in"
        >{{ reason }}</app-inline-notice
      >
    }
  </div>
}
