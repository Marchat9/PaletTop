<div class="nav-shell">
  <app-top-bar
    [title]="appName"
    [links]="navItems"
    [activeKey]="activeNavKey()"
    [showLinks]="!isMobile()"
    [theme]="theme()"
    [notificationBadge]="notificationBadge()"
    [burgerMenuItem]="burgerMenuItem()"
    (changeTheme)="changeTheme.emit($event)"
    (notificationClick)="onNotificationClick()"
    (burgerMenuClick)="burgerMenuClick($event)"
    (itemSelected)="onNavItemSelected($event)"
  />

  <main class="nav-main" [class.nav-main--mobile]="isMobile()">
    <router-outlet />
  </main>

  <app-bottom-nav
    [items]="navItems"
    [activeKey]="activeNavKey()"
    [visible]="isMobile()"
    (itemSelected)="onNavItemSelected($event)"
  />
</div>
