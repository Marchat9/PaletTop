<div class="admin-tournament-page">
  <!-- Main Content -->
  <div
    class="page-content"
    [appAnimateOnChange]="tournament()?.code"
    animation="slide-in"
    [animateOnInit]="true"
  >
    <app-tournament-header
      [tournament]="tournament()"
      [completeLoading]="completeLoading()"
      (completeTournament)="completeTournament()"
      (disconnect)="disconnect()"
    />

    <app-tournament-next-step
      [tournament]="tournament() ?? null"
      [startLoading]="startPending()"
      (addTeam)="addTeam()"
      (importTeams)="importTeams()"
      (startTournament)="startTournament()"
    />

    <app-current-round-card
      [roundNumber]="currentRoundNumber()"
      [groups]="currentRoundGroups()"
      [showMatches]="showCurrentRound()"
      [pointsPerGame]="pointsPerGame()"
      [scoreUpdateLoading]="scoreUpdateLoading()"
      [message]="currentRoundMessage()"
      [showNextButton]="isActive()"
      [canGenerateNext]="canGenerateNewSession()"
      [nextLoading]="nextLoading()"
      (scoreUpdate)="adminScoreUpdate($event)"
      (nextRound)="nextSession()"
    />

    @if (parcoursPlan(); as plan) {
      <app-tournament-parcours
        [plan]="plan"
        [doneRounds]="parcoursDoneRounds()"
        [currentRound]="parcoursCurrentRound()"
        [expanded]="isActive()"
      />
    }

    @if (repechedBrackets().length > 0) {
      <app-repeched-list [brackets]="repechedBrackets()" />
    }

    <app-leaderboard
      [table]="rankingTable()"
      [isLoading]="rankingLoading()"
      emptyLabel="Aucun round démarré."
    >
      @if (canDownloadRanking()) {
        <div leaderboardActions class="ranking-download">
          <app-button
            title="Télécharger le classement (PDF)"
            icon="download"
            variant="secondary"
            [loading]="isRankingExporting()"
            (clicked)="downloadRanking()"
          />
        </div>
      }
    </app-leaderboard>

    <app-rounds-history
      [rounds]="roundHistories()"
      [pointsPerGame]="pointsPerGame()"
      description="Revoir les matchs joués et corriger un score des rounds tirés au sort."
      [scoreUpdateLoading]="scoreUpdateLoading()"
      [canDownload]="canDownloadMatches()"
      [downloadLoading]="isMatchesExporting()"
      (scoreUpdate)="adminScoreUpdate($event)"
      (downloadRequested)="downloadMatches()"
    />

    <app-tournament-configuration-card
      [tournament]="tournament() ?? null"
      [hiddenFields]="hiddenFields"
      [readonlyFields]="readonlyFields"
      [scoreCalculationsByMode]="scoreCalculationsByMode()"
      [saveLoading]="isUpdateConfigLoading()"
      [planState]="planState()"
      [simulation]="simulation()"
      (simulationTeamCountChange)="simulatedTeamCount.set($event)"
      (simulationSheetRequested)="openSimulationSheet($event)"
      (formReady)="onConfigurationFormReady($event)"
      (saveConfiguration)="updateTournamentConfiguration($event)"
    />

    <app-tournament-team-configuration-card
      [tournament]="tournament()"
      [clubSuggestions]="clubSuggestions()"
      (clubSearchRequested)="searchClubs($event)"
      (onTeamUpdate)="updateTournamentTeam($event)"
      (notification)="onNotification($event)"
    />
  </div>
</div>
