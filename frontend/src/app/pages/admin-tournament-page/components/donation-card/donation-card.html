<app-card class="donation-card">
  <div class="donation">
    <div class="head">
      <span class="icon-box" aria-hidden="true">
        <app-icon name="volunteer_activism" iconClass="donation-icon" [ariaHidden]="true" />
      </span>
      <h2 class="title">Votre tournoi s'est bien passé ?</h2>
    </div>
    <p class="text">
      PaletTop est gratuit, sans publicité et développé bénévolement. Si l'application vous a rendu
      service aujourd'hui, un petit don aide à payer l'hébergement et à continuer de l'améliorer.
    </p>
    <div class="actions">
      <a class="donate-link" [href]="donationUrl()" target="_blank" rel="noopener noreferrer">
        <app-icon name="favorite" iconClass="donate-icon" [ariaHidden]="true" />
        <span>Soutenir PaletTop via PayPal</span>
      </a>
    </div>
  </div>
</app-card>
