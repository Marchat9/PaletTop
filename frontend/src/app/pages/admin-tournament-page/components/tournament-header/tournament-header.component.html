<app-admin-page-header
  eyebrow="Pilotage du tournoi"
  icon="label"
  [title]="tournament()?.name ?? null"
  [code]="tournament()?.code ?? null"
  [statuses]="statuses()"
  [metrics]="metrics()"
>
  <!-- Secondary actions live in the menu; "Terminer" also shows up as a button once it is the
       thing to do. -->
  <ng-container headerActions>
    @if (canFinishTournament()) {
      <app-button
        title="Terminer le tournoi"
        icon="flag"
        [loading]="completeLoading()"
        (clicked)="completeTournament.emit()"
      />
    }
    <app-button-icon
      icon="more_vert"
      aria-label="Actions du tournoi"
      [matMenuTriggerFor]="headerMenu"
    />
    <mat-menu #headerMenu="matMenu" class="default-burger-menu-display" xPosition="before">
      <button
        mat-menu-item
        class="menu-item"
        [disabled]="!canFinishTournament()"
        (click)="completeTournament.emit()"
      >
        <app-icon name="flag" [ariaHidden]="true" />
        <span class="menu-label">Terminer le tournoi</span>
      </button>
      <button mat-menu-item class="menu-item danger" (click)="disconnect.emit()">
        <app-icon name="account_circle_off" [ariaHidden]="true" />
        <span class="menu-label">Se déconnecter</span>
      </button>
    </mat-menu>
  </ng-container>

  @if (hasDescription()) {
    <div class="tournament-description">
      <span class="title">Description:</span>
      <span class="description">{{ tournament()?.description }}</span>
    </div>
  }

  <app-rule-pills [rules]="rules()" />
</app-admin-page-header>
