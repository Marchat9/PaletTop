<div class="print-sheet-content">
  <div class="print-header">
    <h1 class="print-title">{{ tournament()?.name }}</h1>
    <p class="print-tournament-code">
      Code du tournoi : <span class="code-value">{{ tournament()?.code }}</span>
    </p>
    <app-qr-code [url]="appUrl" [size]="80" alt="Application QR code" />
  </div>
  <table class="print-table">
    <thead>
      <tr>
        <th>Équipe</th>
        <th>Code</th>
        <th>Joueurs</th>
        <th class="join">Rejoindre</th>
      </tr>
    </thead>
    <tbody>
      @for (team of sortedTeams(); track team.id) {
        <tr>
          <td>{{ team.name }}</td>
          <td>
            <b>{{ team.code }}</b>
          </td>
          <td>{{ team.playerNames }}</td>
          <td class="join">
            @if (team.playerUrl) {
              <app-qr-code [url]="team.playerUrl" [size]="60" alt="QR code pour rejoindre" />
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
