<div class="field-group">
  <label for="{{ formId }}-team-name">Nom de l'equipe (optionnel)</label>
  <app-input-text
    id="{{ formId }}-team-name"
    icon="groups"
    [value]="teamName()"
    [placeholder]="suggestedTeamName()"
    (valueChange)="updateTeamName($event)"
  />
  @if(isChampionship()) {
      <label for="{{ formId }}-team-name">Club de l'équipe</label>
      <app-input-select
        id="{{ formId }}-team-club"
        icon="location_city"
        [options]="championshipClubs()"
        [value]="teamClub()"
        (valueChange)="updateTeamClub($event)"
        />
  }
</div>

<div class="players-block">
  <div class="players-block-header">
    <div class="header">
      <span class="title">Joueurs</span>
      <span class="description">{{ teamPlayers().length }} joueur(s) dans le formulaire</span>
    </div>
    <app-button
      title="Ajouter un joueur"
      variant="tertiary"
      icon="person_add"
      (clicked)="addPlayerRow()"
    />
  </div>

  @for (player of teamPlayers(); track $index) {
    <div class="player-row">
      <app-input-text
        id="{{ formId }}-player-name-{{ $index }}"
        icon="badge"
        placeholder="Nom du joueur"
        [value]="player.name"
        (valueChange)="updatePlayerName($index, $event)"
      />
      @if(!isChampionship()) {
      <app-input-text
        id="{{ formId }}-player-club-{{ $index }}"
        icon="location_city"
        placeholder="Club (optionnel)"
        [value]="player.club"
        (valueChange)="updatePlayerClub($index, $event)"
      />
      }
      <app-button
        title="Retirer"
        icon="person_remove"
        variant="tertiary"
        [disabled]="teamPlayers().length <= 1"
        (clicked)="removePlayerRow($index)"
      />
    </div>
  }
</div>

<div class="actions-row flex-end gap">
  @if (isEditMode()) {
    <app-button title="Annuler" variant="tertiary" icon="close" (clicked)="onCancel()" />
  }
  <app-button
    [title]="isEditMode() ? 'Enregistrer' : 'Creer l\'equipe'"
    [icon]="isEditMode() ? 'save' : 'group_add'"
    [disabled]="!canSubmit()"
    (clicked)="onSubmit()"
  />
</div>
