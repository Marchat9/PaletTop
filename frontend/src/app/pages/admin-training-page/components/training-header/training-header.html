<app-admin-page-header
  eyebrow="Groupe d'entraînement"
  icon="school"
  [title]="training()?.name ?? null"
  [code]="training()?.code ?? null"
  [metrics]="metrics()"
>
  <ng-container headerActions>
    <app-button title="Modifier" icon="edit" variant="secondary" (clicked)="edit.emit()" />
    <app-button-icon
      icon="more_vert"
      aria-label="Actions du groupe d'entraînement"
      [matMenuTriggerFor]="headerMenu"
    />
    <mat-menu #headerMenu="matMenu" class="default-burger-menu-display" xPosition="before">
      <button mat-menu-item class="menu-item" (click)="edit.emit()">
        <app-icon name="edit" [ariaHidden]="true" />
        <span class="menu-label">Modifier le groupe</span>
      </button>
      <button mat-menu-item class="menu-item danger" (click)="disconnect.emit()">
        <app-icon name="account_circle_off" [ariaHidden]="true" />
        <span class="menu-label">Se déconnecter</span>
      </button>
    </mat-menu>
  </ng-container>

  @if (training()?.description) {
    <span class="badge-description">
      <app-icon name="notes" iconClass="icon" [ariaHidden]="true" />
      {{ training()?.description }}
    </span>
  }
</app-admin-page-header>
