<div
  class="popup-surface"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="server-unreachable-title"
  aria-describedby="server-unreachable-text"
>
  <div class="popup-header">
    <h2 id="server-unreachable-title" class="popup-title">
      <app-icon name="cloud_off" iconClass="icon" [ariaHidden]="true" />
      <span>Connexion au serveur impossible</span>
    </h2>
    <button class="popup-close" type="button" aria-label="Fermer" (click)="close()">
      <app-icon name="close" [ariaHidden]="true" />
    </button>
  </div>

  <p id="server-unreachable-text" class="popup-subtitle">
    Le serveur de PaletTop ne répond pas. Vérifiez votre connexion internet, puis réessayez : les
    tournois et les scores ne peuvent pas se mettre à jour tant que le serveur est injoignable.
  </p>

  <app-button
    title="Réessayer"
    icon="refresh"
    variant="primary"
    [large]="true"
    (clicked)="retry()"
  />
</div>
