<div class="join-tournament-popup-container" (keydown.enter)="onConnect()">
  <div class="header-row">
    <h2 class="title">
      <app-icon name="admin_panel_settings" iconClass="icon" [ariaHidden]="true" />
      Connexion à un tournoi
    </h2>
    <button class="close-button" type="button" aria-label="Fermer" (click)="onCancel()">
      <app-icon name="close" />
    </button>
  </div>

  <p class="subtitle">Saisissez vos identifiants pour vous connecter au tournoi.</p>

  <div class="field-group">
    <label class="field-label" for="tournament-code">Code du tournoi</label>
    <app-input-text
      id="tournament-code"
      placeholder="Ex: LAITON-2026"
      autocomplete="off"
      icon="key"
      [value]="tournamentCode()"
      [autofocus]="true"
      [uppercase]="true"
      (valueChange)="onTournamentCodeInput($event)"
    ></app-input-text>
  </div>

  <div class="field-group">
    <label class="field-label">Mot de passe</label>
    <app-input-text
      id="tournament-password"
      placeholder="******"
      icon="key"
      [isPassword]="true"
      [value]="password()"
      (valueChange)="onPasswordChange($event)"
    ></app-input-text>
  </div>

  @if (isUnknownTournament()) {
    <div class="error-container">
      <span class="message">
        <app-icon name="error" [ariaHidden]="true" />
        Tournoi introuvable
      </span>
      <span class="description">
        Veuillez vérifier le code saisi ou contacter l'administrateur du tournoi pour plus
        d'informations.
      </span>
    </div>
  }

  <div class="actions">
    <app-button title="Annuler" variant="secondary" (clicked)="onCancel()"></app-button>
    <app-button
      title="Connexion"
      variant="primary"
      icon="login"
      [loading]="tournamentLoading()"
      [disabled]="!canConnect()"
      (clicked)="onConnect()"
    ></app-button>
  </div>
</div>
