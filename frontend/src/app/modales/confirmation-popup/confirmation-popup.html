<div class="confirmation-popup">
  <div class="header-row">
    <h2 class="title">
      <app-icon [name]="data.icon ?? 'warning'" iconClass="icon" [ariaHidden]="true" />
      {{ data.title }}
    </h2>
  </div>

  <p class="message">{{ data.message }}</p>

  @if (data.info; as info) {
    <app-info-tile [icon]="info.icon" [label]="info.label" [value]="info.value" />
  }

  @if (data.notice) {
    <app-inline-notice tone="alert" role="note">{{ data.notice }}</app-inline-notice>
  }

  <div class="footer" [class.with-opt-out]="!!data.dontAskAgainLabel">
    @if (data.dontAskAgainLabel) {
      <app-input-checkbox
        class="opt-out"
        [label]="data.dontAskAgainLabel"
        [checked]="dontAskAgain()"
        (checkedChange)="dontAskAgain.set($event)"
      />
    }
    <div class="actions">
      <app-button
        [title]="data.cancelLabel ?? 'Annuler'"
        variant="secondary"
        (clicked)="onCancel()"
      />
      <app-button
        [title]="data.confirmLabel ?? 'Confirmer'"
        variant="primary"
        icon="check"
        (clicked)="onConfirm()"
      />
    </div>
  </div>
</div>
