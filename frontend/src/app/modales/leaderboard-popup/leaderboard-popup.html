<div
  class="popup-container popup-surface leaderboard-popup"
  [class.wide]="isTournament"
  role="dialog"
  aria-modal="true"
>
  <div class="popup-header">
    <h2 class="popup-title">
      <app-icon [name]="presentation.icon" iconClass="icon" [ariaHidden]="true" />
      <span
        >{{ presentation.title }} <span class="highlight">{{ presentation.highlight }}</span></span
      >
    </h2>
    <button class="popup-close" type="button" aria-label="Fermer" (click)="onClose()">
      <app-icon name="close" />
    </button>
  </div>

  @if (presentation.subtitle) {
    <p class="popup-subtitle">{{ presentation.subtitle }}</p>
  }

  <div class="popup-body">
    <app-leaderboard
      [table]="table()"
      [framed]="false"
      [showPodium]="true"
      [isLoading]="isLoading()"
      [error]="error()"
      [highlightedId]="highlightedId"
      [emptyLabel]="presentation.emptyLabel"
    />
  </div>
</div>
