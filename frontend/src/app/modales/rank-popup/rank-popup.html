<div class="rank-popup leaderboard-popup">
  <div class="header-row">
    <h2 class="title">
      Tournoi :
      <span class="name">
        {{ data.tournamentName }}
      </span>
    </h2>
  </div>

  <div class="body">
    <app-leaderboard
      [table]="table"
      [framed]="false"
      [showPodium]="true"
      [highlightedId]="data.teamId"
      emptyLabel="Aucun round démarré."
    />
  </div>

  <div class="actions">
    <app-button [title]="data.closeLabel ?? 'Fermer'" variant="secondary" (clicked)="onCancel()" />
  </div>
</div>
