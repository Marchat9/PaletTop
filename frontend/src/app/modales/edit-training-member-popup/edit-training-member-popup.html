<div class="popup-container popup-surface" (keydown.enter)="onSubmit()">
  <div class="popup-header">
    <h2 class="popup-title">
      <app-icon name="person" iconClass="icon" [ariaHidden]="true" />
      Modifier le membre
    </h2>
    <button class="popup-close" type="button" aria-label="Fermer" (click)="onCancel()">
      <app-icon name="close" />
    </button>
  </div>

  <p class="popup-subtitle">
    Le nouveau nom s'affiche aussi dans les séances déjà jouées. Ses statistiques sont conservées.
  </p>

  <div class="field-group">
    <label class="field-label" for="edit-training-member-name">Prénom et nom</label>
    <app-input-text
      id="edit-training-member-name"
      placeholder="Ex : Thomas Martin"
      icon="person"
      [value]="name()"
      [autofocus]="true"
      (valueChange)="onNameChange($event)"
    ></app-input-text>
  </div>

  @if (visibleError()) {
    <div class="error-container">
      <span class="message">
        <app-icon name="error" [ariaHidden]="true" />
        {{ visibleError() }}
      </span>
    </div>
  }

  <div class="actions">
    <app-button title="Annuler" variant="secondary" (clicked)="onCancel()"></app-button>
    <app-button
      title="Enregistrer"
      variant="primary"
      icon="check"
      [loading]="loading()"
      [disabled]="!canSubmit()"
      (clicked)="onSubmit()"
    ></app-button>
  </div>

  <div class="remove-row">
    <app-button
      title="Retirer du club"
      variant="error"
      icon="person_remove"
      (clicked)="onRemove()"
    ></app-button>
  </div>
</div>
