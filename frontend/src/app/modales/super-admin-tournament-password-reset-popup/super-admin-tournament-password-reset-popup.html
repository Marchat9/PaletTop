<div class="password-reset-popup-container">
  <div class="header-row">
    <h2 class="title">
      <app-icon name="key" iconClass="icon" [ariaHidden]="true" />
      Réinitialiser le mot de passe
    </h2>
    <button class="close-button" type="button" aria-label="Fermer" (click)="onCancel()">
      <app-icon name="close" />
    </button>
  </div>

  <p class="subtitle">
    Tournoi <strong>{{ data.name }}</strong> ({{ data.code }}). L'ancien mot de passe ne peut pas
    être affiché — saisis-en un nouveau et communique-le à l'organisateur.
  </p>

  <div class="field-group">
    <label class="field-label" for="new-password">Nouveau mot de passe</label>
    <app-input-text
      id="new-password"
      placeholder="Nouveau mot de passe"
      [autofocus]="true"
      [value]="newPassword()"
      (valueChange)="onPasswordChange($event)"
    ></app-input-text>
  </div>

  @if (request().error && hasSubmitted) {
    <div class="error-container">
      <app-icon name="error" [ariaHidden]="true" />
      <span>{{ request().error }}</span>
    </div>
  }

  <div class="actions">
    <app-button title="Annuler" variant="secondary" (clicked)="onCancel()"></app-button>
    <app-button
      title="Réinitialiser"
      variant="primary"
      icon="key"
      [loading]="request().isLoading"
      [disabled]="!canConfirm()"
      (clicked)="onConfirm()"
    ></app-button>
  </div>
</div>
