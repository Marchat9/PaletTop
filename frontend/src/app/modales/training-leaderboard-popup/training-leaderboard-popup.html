<div class="popup-container popup-surface leaderboard-popup" role="dialog" aria-modal="true">
  <div class="popup-header">
    <h2 class="popup-title">
      @if (isClub) {
        <app-icon name="military_tech" iconClass="icon" [ariaHidden]="true" />
        <span>Classement du <span class="highlight">club</span></span>
      } @else {
        <app-icon name="leaderboard" iconClass="icon" [ariaHidden]="true" />
        <span>Classement de la <span class="highlight">séance</span></span>
      }
    </h2>
    <button class="popup-close" type="button" aria-label="Fermer" (click)="onClose()">
      <app-icon name="close" />
    </button>
  </div>

  <p class="popup-subtitle">
    @if (isClub) {
      Cumul de toutes les séances du club : victoires et points additionnés, invités non comptés.
    } @else {
      Classement individuel : chaque joueur d'une équipe gagnante marque la totalité des points.
    }
  </p>

  <div class="popup-body">
    <app-leaderboard
      [table]="table()"
      [framed]="false"
      [showPodium]="true"
      [isLoading]="isLoading()"
      [error]="error()"
      [highlightedId]="highlightedId"
      [emptyLabel]="emptyLabel"
    />
  </div>
</div>
