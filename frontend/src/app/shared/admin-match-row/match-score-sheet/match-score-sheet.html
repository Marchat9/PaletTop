<div class="sheet" role="dialog" aria-labelledby="match-score-sheet-title" appSwipeToDismiss>
  <span class="handle" aria-hidden="true"></span>

  <div class="sheet-header">
    <h2 id="match-score-sheet-title" class="sheet-title">Plaque {{ match.plateNumber }}</h2>
    <span class="previous-score">Avant : {{ match.scoreA }} – {{ match.scoreB }}</span>
  </div>

  <div class="team-line">
    <span class="team">{{ match.teamA }}</span>
    <app-score-stepper
      size="large"
      [value]="draftScoreA()"
      [max]="data.pointsPerGame"
      [teamName]="match.teamA"
      (valueChange)="draftScoreA.set($event)"
    />
  </div>

  <div class="team-line">
    <span class="team">{{ match.teamB }}</span>
    <app-score-stepper
      size="large"
      [value]="draftScoreB()"
      [max]="data.pointsPerGame"
      [teamName]="match.teamB ?? ''"
      (valueChange)="draftScoreB.set($event)"
    />
  </div>

  <div class="sheet-actions">
    <app-button title="Annuler" variant="secondary" [large]="true" (clicked)="cancel()" />
    <app-button
      title="Enregistrer"
      variant="primary"
      icon="check"
      [large]="true"
      [disabled]="!hasChanges()"
      (clicked)="save()"
    />
  </div>
</div>
