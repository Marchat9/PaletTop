<div class="chips" role="group" [attr.aria-label]="name() || null">
  @for (option of options(); track option.value) {
    <label class="chip" [class.selected]="isSelected(option)" [class.locked]="option.locked">
      <input
        type="checkbox"
        [checked]="isSelected(option)"
        [disabled]="!!option.locked"
        (change)="toggle(option)"
      />
      <span class="label">{{ option.label }}</span>
      @if (option.locked) {
        <app-icon name="lock" iconClass="chip-icon" [ariaHidden]="true" />
      }
    </label>
  }
</div>
