<div class="input-text-wrapper">
  @if (icon()) {
    <app-icon [name]="icon()" iconClass="input-icon" [ariaHidden]="true" />
  }

  <input
    #inputElement
    [attr.id]="id() || null"
    class="input-text"
    [class.with-icon]="!!icon()"
    [class.with-password-toggle]="isPassword()"
    [class.invalid]="invalid()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy() || null"
    [attr.role]="role() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-activedescendant]="ariaActivedescendant() || null"
    [attr.aria-autocomplete]="ariaAutocomplete() || null"
    [type]="isPassword() && !showPassword() ? 'password' : 'text'"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [attr.maxlength]="maxLength()"
    [attr.inputmode]="inputmode()"
    [attr.enterkeyhint]="enterKeyHint()"
    [value]="internalValue()"
    [disabled]="disabled()"
    [attr.autocapitalize]="uppercase() ? 'characters' : 'off'"
    [style.text-transform]="uppercase() ? 'uppercase' : 'none'"
    (input)="onInput($any($event.target).value)"
    (focus)="focused.emit()"
    (blur)="blurred.emit()"
    (keydown)="keyPressed.emit($event)"
  />

  @if (isPassword()) {
    <button
      type="button"
      class="password-toggle"
      [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      [disabled]="disabled()"
      (click)="toggleShowPassword()"
    >
      <app-icon [name]="showPassword() ? 'visibility_off' : 'visibility'" [ariaHidden]="true" />
    </button>
  }
</div>
