<ol class="podium" [style.--steps]="steps().length" aria-label="Podium">
  @for (step of steps(); track step.key) {
    <li
      class="podium-step"
      [class]="'place-' + step.place"
      [class.is-highlighted]="step.isHighlighted"
    >
      <span class="medal" [attr.aria-label]="'Rang ' + step.rankLabel">{{ step.rankLabel }}</span>
      <strong class="podium-names">
        @for (name of step.names; track $index) {
          <span class="podium-name">{{ name }}</span>
        }
        @if (step.hiddenCount > 0) {
          <span class="podium-more">+{{ step.hiddenCount }}</span>
        }
      </strong>
      <span class="podium-summary">{{ step.summary }}</span>
    </li>
  }
</ol>
