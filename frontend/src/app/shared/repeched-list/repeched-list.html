<app-card-collapsible [isExpanded]="true">
  <div header class="header">
    <div class="header-title">
      <app-icon name="how_to_reg" iconClass="icon" [ariaHidden]="true" />
      <h2 class="title">Repêchés</h2>
    </div>
  </div>

  <div content class="repeched-content">
    @for (bracket of brackets(); track bracket.key) {
      <section class="bracket">
        <h3 class="bracket-title">
          {{ bracket.label }}
          <span class="bracket-count">
            · {{ bracket.teams.length }} {{ bracket.teams.length > 1 ? 'repêchés' : 'repêché' }}
          </span>
        </h3>
        <ul class="teams">
          @for (team of bracket.teams; track team.teamId) {
            <li class="team">
              <span class="team-name">{{ team.teamName }}</span>
              <span class="team-defeat">défaite {{ team.defeat }}</span>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</app-card-collapsible>
