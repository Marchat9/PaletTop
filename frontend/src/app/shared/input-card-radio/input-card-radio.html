<div class="card-radio-group" role="radiogroup" [style.--card-radio-basis]="99 / columns() + '%'">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="card-radio-button"
      [class.selected]="internalValue() === option.value"
      [attr.aria-pressed]="internalValue() === option.value"
      (click)="onSelect(option.value)"
    >
      @if (option.icon) {
        <app-icon [name]="option.icon!" iconClass="icon" [ariaHidden]="true" />
      }

      <div class="card-radio-content">
        <p class="card-radio-name">{{ option.label }}</p>
        @if (option.description) {
          <p class="card-radio-description">{{ option.description }}</p>
        }
      </div>

      <app-icon
        [name]="internalValue() === option.value ? 'check_circle' : 'radio_button_unchecked'"
        iconClass="icon"
        [ariaHidden]="true"
      />
    </button>
  }
</div>
