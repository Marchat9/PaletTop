<div class="card-content">
  <div class="info-text">
    <app-icon name="info"></app-icon>
    <label class="info-label">Pensez à utiliser le calcul des points 'Points championnat'</label>
  </div>

  <div class="form-group">
    <label class="form-label" for="tournament-home-team"
      >Équipe à domicile <span class="mandatory">*</span></label
    >
    <app-input-text
      id="tournament-home-team"
      placeholder="Ex: Club de la Boule d'Or"
      [formControl]="group().controls.homeTeam"
    ></app-input-text>
  </div>

  <div class="form-group">
    <label class="form-label" for="tournament-away-team"
      >Équipe à l'extérieur <span class="mandatory">*</span></label
    >
    <app-input-text
      id="tournament-away-team"
      placeholder="Ex: Club du Cochonnet Fringant"
      [formControl]="group().controls.awayTeam"
    ></app-input-text>
    @if (group().controls.awayTeam.errors?.['sameClub']) {
      <span class="field-error">Les deux clubs doivent être différents.</span>
    }
  </div>
</div>
