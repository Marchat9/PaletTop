<app-card>
  <div class="card-header">
    <app-icon name="sports_handball" iconClass="icon" />
    <h2>Paramètres de Jeu</h2>
  </div>

  <div class="card-content padding">
    <!-- Competition mode and score calculation: side by side, stacked on mobile -->
    <div class="mode-and-score">
      <div class="form-group">
        <label class="form-label">Mode de Compétition <span class="mandatory">*</span></label>
        <app-input-card-radio
          [columns]="1"
          [options]="competitionModeOptions"
          [formControl]="group().controls.competitionMode"
        ></app-input-card-radio>
      </div>

      @if (!hiddenFields().includes('scoreCalculation')) {
        <div class="form-group">
          <label class="form-label">Calcul des scores <span class="mandatory">*</span></label>
          <app-input-card-radio
            [columns]="2"
            [options]="scoreCalculationOptions()"
            [formControl]="group().controls.scoreCalculation"
          ></app-input-card-radio>
        </div>
      }
    </div>

    <div class="separator"></div>

    @switch (group().controls.competitionMode.value) {
      @case ('standard') {
        <app-structured-tournament
          [group]="group().controls.structuredMode"
          [targetControl]="targetControl()"
          [planState]="planState()"
          [simulation]="simulation()"
          (simulationTeamCountChange)="simulationTeamCountChange.emit($event)"
          (simulationSheetRequested)="simulationSheetRequested.emit($event)"
          [readonlyFields]="readonlyFields()"
          [hiddenFields]="hiddenFields()"
        />
      }
      @case ('up_down') {
        <app-up-down-tournament
          [group]="group().controls.upDownMode"
          [readonlyFields]="readonlyFields()"
          [hiddenFields]="hiddenFields()"
        />
      }
      @case ('championship') {
        <app-championship-tournament
          [group]="group().controls.championshipMode"
          [readonlyFields]="readonlyFields()"
          [hiddenFields]="hiddenFields()"
        />
      }
      @default {
        <span class="no-competition-configured"
          >Pas de configuration supplémentaire pour ce type de compétition.</span
        >
      }
    }
  </div>
</app-card>
