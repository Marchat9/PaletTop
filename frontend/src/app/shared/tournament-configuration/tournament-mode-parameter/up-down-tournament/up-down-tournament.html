<div class="card-content">
  @if (!hiddenFields().includes('pairingMode')) {
    <div class="form-group">
      <label class="form-label">Mode d'appariement</label>
      <app-input-card-radio
        [options]="pairingModeOptions"
        [formControl]="group().controls.pairingMode"
      ></app-input-card-radio>
    </div>
  }

  <div class="form-group">
    <label class="form-label" for="tournament-number-of-round">Nombre de partie</label>
    <p class="form-label-description">Limiter le nombre de rounds dans ce mode de compétition</p>
    <app-input-number
      id="tournament-number-of-round"
      [formControl]="group().controls.numberOfRound"
      [zeroAsUndefined]="true"
      placeholder="Sans limite - l'admin cloture quand il le souhaite"
      [placeholderAsValue]="true"
      [min]="0"
      [max]="999"
      [step]="1"
    ></app-input-number>
  </div>

  <div class="form-group">
    <app-switch
      label="Figer la dernière partie"
      description="La dernière partie n'est pas tirée au sort : chaque équipe affronte son voisin direct au classement (1er contre 2e, 3e contre 4e…).&#10;Le classement final se décide sur cette partie : le gagnant de la plaque 1 termine 1er, le perdant 2e, le gagnant de la plaque 2 termine 3e, etc. Si le nombre d'équipes est impair, la dernière du classement ne joue pas, ne marque aucun point et termine dernière."
      warning="Attention : deux équipes qui se sont déjà rencontrées peuvent donc se rejouer."
      [formControl]="group().controls.lastRoundByRanking"
    ></app-switch>
    @if (!isLastRoundByRankingAllowed()) {
      <p class="form-label-description padding-left">
        Disponible à partir de 2 parties définies : au moins une partie tirée au sort est nécessaire
        avant la dernière partie figée.
      </p>
    }
  </div>
</div>
