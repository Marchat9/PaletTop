<div class="card-content">
  <div class="form-group">
    <label class="form-label">Nombre de partie</label>
    <p class="form-label-description">Limiter le nombre de rounds dans ce mode de compétition</p>
    <app-input-number
      [formControl]="group().controls.numberOfRound"
      [zeroAsUndefined]="true"
      placeholder="Sans limite - l'admin cloture quand il le souhaite"
      [placeholderAsValue]="true"
      [min]="0"
      [max]="999"
      [step]="1"
    ></app-input-number>
  </div>

  @if (isLastRoundByRankingAllowed()) {
    <div class="form-group">
      <app-input-checkbox
        label="Dernière partie au classement"
        description="La dernière partie n'est pas tirée au sort : chaque équipe affronte son voisin de classement (1er contre 2e, 3e contre 4e...). Si le nombre d'équipes est impair, le dernier du classement est exempté, sans point."
        [formControl]="group().controls.lastRoundByRanking"
      ></app-input-checkbox>
    </div>
  }
</div>
