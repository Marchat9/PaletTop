<article
  class="metric-tile"
  [class]="size()"
  [class.clickable]="clickable()"
  (click)="clickable() && onClick($event)"
>
  <p class="value">{{ value() }}</p>
  <p class="label">{{ label() }}</p>
  @if (clickable()) {
    <app-icon name="chevron_right" iconClass="clickable-hint" [ariaHidden]="true" />
  }
</article>
