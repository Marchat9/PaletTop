server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated at container startup (see docker-entrypoint.d) — must never be
    # cached, otherwise API_BASE_URL changes go unnoticed after a redeploy.
    location = /assets/env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Must always be re-fetched so the service worker detects new deployments promptly.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }
}
